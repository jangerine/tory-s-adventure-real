<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>WASD 토리의 모험</title>
  <style>
    body {
      background-color: #1e1e24;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    #info {
      margin-bottom: 10px;
      text-align: center;
    }
    canvas {
      border: 4px solid #4a4e69;
      background-color: #22223b;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    .key-badge {
      display: inline-block;
      background: #ff595e;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="info">
    <h1>WASD 토리의 모험</h1>
    <p>현재 접속자 수: <span id="player-count">0</span>명</p>
    <p>당신이 담당할 방향키: <span id="my-key" class="key-badge">할당 중...</span></p>
  </div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
